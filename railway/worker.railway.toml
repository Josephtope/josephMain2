# Configure this file as the Worker service's Railway Config File.
# The service must be connected to the Josephtope/josephMain2 repository.
[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm build"

[deploy]
startCommand = "pnpm start:worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
